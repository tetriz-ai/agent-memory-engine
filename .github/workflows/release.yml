name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  UV_VERSION: "0.13.5"
jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing: PyPI accepts this run's identity, no token is stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(grep '^__version__ = ' src/agent_memory_engine/__init__.py | cut -d '"' -f 2)"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version" >&2; exit 1; }
      - run: scripts/check-package.sh
      - run: uv build --out-dir dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
